name: Deploy Landing Site

# main deploys production. Nightly (nightly.pywire.dev) only takes PRs that are
# ready for review: drafts and bare branch pushes never deploy. Mark a PR
# ready, or push to one that already is, to put it on nightly.
#
# Building runs PR code and third-party install scripts, so it holds no
# secrets: it uploads site/dist as an artifact. Deploying only downloads that
# artifact and uploads it to Pages, in a job whose environment only main can
# use. PR builds deploy from deploy-nightly.yml (workflow_run), which runs
# main's copy of that workflow, never the PR's.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'site/**'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'site/**'

permissions: {}

jobs:
  build:
    # PRs: ready for review only, and only from this repo.
    if: >-
      github.event_name != 'pull_request'
      || (!github.event.pull_request.draft
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Build Landing Site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the PR's own head, not GitHub's merge preview.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        working-directory: site
        run: pnpm run build

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landing-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 3

  deploy-production:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Strictly one deploy at a time: a running deploy is never cancelled, and
    # a newer one waits for it (GitHub keeps only the newest waiting job).
    concurrency:
      group: deploy-landing-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The environment is restricted to main in the repo settings and holds
    # CLOUDFLARE_PAGES_TOKEN, so no other branch's workflow can read it.
    environment:
      name: production
      url: https://pywire.dev
    permissions: {}
    name: Deploy Landing Site
    steps:
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: landing-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: '4.145.0'
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pywire-landing --branch=main
