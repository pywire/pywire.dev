name: Infra apply

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: terraform
  cancel-in-progress: false # never cancel mid-apply

jobs:
  apply:
    # The real guard is the production environment: it is restricted to main
    # in the repo settings and holds the write credentials, so a dispatch from
    # any other branch (which runs that branch's copy of this file) gets
    # nothing. The job-level `if` just skips such runs cleanly.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_forwarding_rules: ${{ secrets.EMAIL_FORWARDING_RULES }}
      TF_VAR_maintainer_emails: ${{ secrets.MAINTAINER_EMAILS }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - run: terraform init -input=false

      - run: terraform apply -input=false -auto-approve -no-color -lock-timeout=300s

      - name: Verify converged (plan must be empty)
        run: terraform plan -input=false -no-color -detailed-exitcode -lock-timeout=120s
